spring:
  application:
    name: PictureGo
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
  # Redis配置
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      timeout: 5000
  # Session 配置
  session:
    timeout: 30d # 30天过期
    redis:
      namespace: "picturego:session"

server:
  port: 8080
  servlet:
    context-path: /picgo
    session:
      cookie:
        max-age: 30d # 30天过期

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_delete  #逻辑删除字段名
      logic-delete-value: 1  #逻辑删除值
      logic-not-delete-value: 0  #逻辑不删除值