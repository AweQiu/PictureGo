spring:
  application:
    name: PictureGo
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /picgo

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_delete  #逻辑删除字段名
      logic-delete-value: 1  #逻辑删除值
      logic-not-delete-value: 0  #逻辑不删除值