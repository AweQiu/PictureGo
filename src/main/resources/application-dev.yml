spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picturego
    username: root
    password: 1234

server:
  port: 8880
  servlet:
    context-path: /picturego

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_delete  #逻辑删除字段名
      logic-delete-value: 1  #逻辑删除值
      logic-not-delete-value: 0  #逻辑不删除值

# springdoc-openapi项目接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      display-name: 默认分组
      paths-to-match: '/**'
      packages-to-scan: com.ylh.picturego.controller

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh-CN

